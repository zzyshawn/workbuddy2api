# WorkBuddy / CodeBuddy 登录态 -> OpenAI / Anthropic / Responses 兼容 API
#
# ===========================================================================
# 群晖（Synology）部署速查
# ===========================================================================
#
# 【两种构建方式，选一种】
#
#  方式 A：直接用源码目录（推荐，改代码方便）
#      把仓库整个目录放到 /volume1/docker/workbuddy2api/
#      下面 build.context 保持 `.`，直接 up -d --build
#
#  方式 B：直接用 tar 包（只传一个文件到 NAS）
#      把 wb2api.tar.gz 放到 /volume1/docker/workbuddy2api/
#      并把下面 build.context 改成 `./wb2api.tar.gz`
#      包内是「扁平结构」（Dockerfile / requirements.txt / *.py 直接在包根），
#      Docker 原生支持 .tar.gz 作为 build context，无需先解压。
#
#      ⚠️ 包必须满足两个条件，否则构建会失败：
#        1. 包根就是项目根（不能有 workbuddy2api/ 这层前缀），
#           否则 `COPY requirements.txt .` 找不到文件；
#        2. 必须含 Dockerfile（build.dockerfile 指向包内路径）。
#      仓库里的打包脚本已经按这个约定生成。
#
# ===========================================================================
#
# 1) 目录布局（auth 与 logs 都需要，**必须先手工建好**）：
#      /volume1/docker/workbuddy2api/        <- 代码 或 wb2api.tar.gz
#      /volume1/docker/workbuddy2api/auth/   <- 凭据（从电脑复制过来）
#      /volume1/docker/workbuddy2api/logs/   <- 日志
#
#    ⚠️ 群晖的 Docker **不会**自动创建 bind mount 的宿主机目录（Linux 会），
#       缺目录时项目启动直接报 `Bind mount failed`。先在 File Station 建好。
#
# 2) 凭据怎么放 —— **国内版和国际版一定要分开放**：
#      auth/cn/Tencent-Cloud.coding-copilot.info     <- 国内版（2026-09-28 起，
#        workbuddy-desktop.info 已被桌面端加密改版不可用；国内域明文凭据以
#        桌面端 Tencent-Cloud.coding-copilot.info 为准，见 cn 实例注释）
#      auth/intl/Tencent-Cloud.coding-copilot.info   <- 国际版
#    两个环境是**两个 realm 的两份 token**，混在一个目录会随机取错 -> 全链路 401。
#
# 3) 凭据从电脑哪里复制：
#      Windows: %LOCALAPPDATA%\CodeBuddyExtension\Data\Public\auth\
#      macOS  : ~/Library/Application Support/CodeBuddyExtension/Data/Public/auth/
#      Linux  : ~/.local/share/CodeBuddyExtension/Data/Public/auth/
#
# 4) 启动（SSH 到群晖后，在代码目录里）：
#      sudo docker-compose up -d --build       # 旧版
#      sudo docker compose up -d --build       # Docker Compose v2
#    验证（双实例各查各的）：
#      curl http://127.0.0.1:8787/health       # intl（codebuddy.ai，uid 18d455b9…）
#      curl http://127.0.0.1:8790/health       # cn  （codebuddy.cn，uid 0f6d6ce4…）
#    日志：
#      sudo docker compose logs -f
#      tail -f logs/converter-intl.log logs/converter-cn.log
#
# ===========================================================================
# 双实例架构（2026-09-28）：
#   - intl 实例：反代 + 任务都对着国际域（codebuddy.ai realm），走东京代理；
#   - cn   实例：反代 + 任务都对着国内域（codebuddy.cn realm），家里直连；
#   - 两个实例 = 两个反代端点，各自上游域，互不冲突（一个进程/实例只绑一个域）。
# ===========================================================================

services:
  # ===========================================================================
  # 实例 1：国际版（codebuddy.ai realm）
  # ===========================================================================
  workbuddy2api-intl:
    build:
      # —— 方式 A：从源码目录构建（群晖只能这样）——
      # ⚠️ 群晖 Container Manager 不支持 .tar.gz 作为 build context
      #（报错特征：context must be a directory）。普通 Linux 主机才可用 tar 包。
      context: .
      dockerfile: Dockerfile

    # 镜像 tag = model_registry.SERVICE_VERSION（CLI 版本 + 服务构建号）。
    # ⚠️ 服务代码每次实质变更必须 bump model_registry.SERVICE_BUILD 并同步改这行
    # —— tag 不变会静默复用旧镜像（踩过两次）。
    image: workbuddy2api:2.158.0-b13
    container_name: workbuddy2api-intl

    ports:
      - "8787:8787"
      # 暴露到局域网前**务必**设置 CODEBUDDY2OPENAI_KEY。
      # ⚠️ /health 不参与鉴权，且会回显 uid / 昵称 / 凭据路径，别裸奔到公网。

    volumes:
      # 【必须可写，不要加 :ro】converter 会原子回写 auth 文件（token 刷新）。
      # 挂「目录」而不是单个 .info 文件，否则容器内 rename 会报 busy。
      # ★ 群晖请用**绝对路径**：
      - "/volume1/docker/workbuddy2api/auth:/data/auth"
      - "/volume1/docker/workbuddy2api/logs:/logs"

    environment:
      - CODEBUDDY_AUTH_DIR=/data/auth

      # ---- 环境锁定 intl：双实例下各自认准自己的凭据，不靠 auto 推断 ----
      - CODEBUDDY2OPENAI_ENV=intl
      - CODEBUDDY2OPENAI_AUTH_INTL=/data/auth/intl/Tencent-Cloud.coding-copilot.info

      # ---- 国际域代理（东京 VPS SOCKS5）----
      # 签到/对话都是 HTTPS over TCP，代理只需支持 TCP 转发；
      # httpx 的 socks5 不做 UDP ASSOCIATE，UDP 配了也没用。
      # - CODEBUDDY2OPENAI_PROXY_INTL=socks5://user:pass@192.168.1.100:1080

      # ---- 本地 API 鉴权 ----
      - CODEBUDDY2OPENAI_KEY=
      # 日志/快照按实例分文件，避免互覆
      - CODEBUDDY2OPENAI_LOG=/logs/converter-intl.log
      - CODEBUDDY2OPENAI_STATE_FILE=/logs/state-intl.json
      # 默认只记错误/异常；排障再开：
      # - CODEBUDDY2OPENAI_LOG_REQUESTS=1
      # - CODEBUDDY2OPENAI_LOG_BODIES=1

      # ---- 上游 UA 版本（可选）----
      # ① 版本文件（推荐，热生效）：logs/ua-version.txt，清空 = 恢复内置默认。
      # ② 环境变量（要重建容器才生效）：
      # - CODEBUDDY2OPENAI_UA_VERSION=2.158.0

      - PYTHONUNBUFFERED=1
      # 【六类定时任务按容器时区判定整点】务必留 Asia/Shanghai
      - TZ=Asia/Shanghai

      # ---- 六类任务时点与开关（缺省即默认值，按需打开注释改写）----
      # - CODEBUDDY2OPENAI_CHECKIN_HOURS=9,21       # 签到
      # - CODEBUDDY2OPENAI_TRAVEL_HOURS=9,21        # 猫猫旅行
      # - CODEBUDDY2OPENAI_ACTIVITY_HOURS=10        # 活跃上报
      # - CODEBUDDY2OPENAI_KEEPALIVE_HOURS=22       # token 保活
      # - CODEBUDDY2OPENAI_SCHOOL_HOURS=12          # 开学季任务
      # - CODEBUDDY2OPENAI_CAT_HOURS=1              # 夜猫子任务
      # - CODEBUDDY2OPENAI_ACTIVITY_REPORT_COUNT=5  # 每次活跃上报条数

    command:
      - python3
      - converter.py
      - --host
      - "0.0.0.0"
      - --port
      - "8787"
      - --log
      - /logs/converter-intl.log
      # 脱敏：压缩回溯上下文里的 Codex / Claude 脚手架指令。
      # 若发现模型表现异常（丢工具调用、不认上下文），先注释掉这行再排查。
      - --desensitize

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # 群晖上建议 unless-stopped：开机自启，手动停掉后不会自己又起来
    restart: unless-stopped

  # ===========================================================================
  # 实例 2：国内版（codebuddy.cn realm）—— 2026-09-28 新增
  #
  # 背景：workbuddy-desktop.info 被 WorkBuddy 桌面端 09-28 升级改成
  # `$wbEncrypted` 信封加密（AES-256-GCM，keyId 9127dea1b44020a7，密钥只在
  # 桌面端内存/daemon 分发，不落盘），旧明文 token 也随桌面端刷新被轮换吊销
  # → 签到全 401。
  #
  # 恢复凭据 = 桌面端 Tencent-Cloud.coding-copilot.info（09-26 刷新，
  # 国内域 codebuddy.cn realm 的**明文** JWT，uid 0f6d6ce4…，
  # 实测 streak/余额/签到接口全 200）。放到 auth/cn/ 下即可。
  #
  # 风险提示：桌面端下次在 codebuddy.cn realm 刷新登录时可能再次轮换吊销
  # 这份 token。cn 实例自身会凭 refreshToken 续期并回写文件（独立会话），
  # 正常可自持；若再度 401，重新从桌面端拷一份最新明文文件即可。
  # ===========================================================================
  workbuddy2api-cn:
    image: workbuddy2api:2.158.0-b13
    container_name: workbuddy2api-cn

    ports:
      - "8790:8787"

    volumes:
      # 与 intl 实例共用同一个 auth/ 父目录，靠 env 指向各自子目录
      - "/volume1/docker/workbuddy2api/auth:/data/auth"
      - "/volume1/docker/workbuddy2api/logs:/logs"

    environment:
      - CODEBUDDY_AUTH_DIR=/data/auth
      - CODEBUDDY2OPENAI_ENV=cn
      - CODEBUDDY2OPENAI_AUTH_CN=/data/auth/cn/Tencent-Cloud.coding-copilot.info
      # 国内域家里直连即可，不配代理；要配时用：
      # - CODEBUDDY2OPENAI_PROXY_CN=

      - CODEBUDDY2OPENAI_KEY=
      - CODEBUDDY2OPENAI_LOG=/logs/converter-cn.log
      - CODEBUDDY2OPENAI_STATE_FILE=/logs/state-cn.json

      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai

    command:
      - python3
      - converter.py
      - --host
      - "0.0.0.0"
      - --port
      - "8787"
      - --log
      - /logs/converter-cn.log
      - --desensitize

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped